global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "network-traffic-monitor"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules
rule_files:
  - "alerts.yml"

# Scrape configurations
scrape_configs:
  # API metrics
  - job_name: "network-traffic-api"
    static_configs:
      - targets: ["api:8000", "host.docker.internal:8000", "localhost:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Node exporter
  - job_name: "node"
    static_configs:
      - targets:
          ["node-exporter:9100", "host.docker.internal:9100", "localhost:9100"]

  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]
    metrics_path: "/metrics"
